services:
  db:
    image: postgres:17-alpine
    container_name: safari-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: safari
      POSTGRES_PASSWORD: safari
      POSTGRES_DB: safari
    ports:
      - '5433:5432'
    volumes:
      - safari-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U safari']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  safari-db-data:
